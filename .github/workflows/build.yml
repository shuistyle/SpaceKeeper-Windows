# ======================================================================
# build.yml — GitHub builds SpaceKeeper for Windows automatically
# ======================================================================
# Every time code is pushed to GitHub, a Windows machine in the cloud:
#   1. runs the automatic tests for SpaceKeeper.Core,
#   2. builds SpaceKeeper for Intel/AMD (x64) and Arm (ARM64) PCs,
#   3. uploads each as a .zip you can download from the run's
#      "Artifacts" section (Actions tab on GitHub).
# Pushing a version tag such as v1.0.0 also creates a GitHub Release with
# both zips attached — that's the easiest download link to share.
# ======================================================================
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: write      # needed to create Releases for version tags

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        run: dotnet test tests/SpaceKeeper.Core.Tests/SpaceKeeper.Core.Tests.csproj -c Release

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and publish (${{ matrix.platform }})
        run: >
          dotnet publish src/SpaceKeeper.App/SpaceKeeper.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          --self-contained true
          -o publish/${{ matrix.rid }}

      # Stop here (rather than publish a download that can't open its windows)
      # if the compiled layouts file is missing.
      - name: Check the layouts file is included
        shell: pwsh
        run: |
          $dir = "publish/${{ matrix.rid }}"
          if (-not ((Test-Path "$dir/SpaceKeeper.pri") -or (Test-Path "$dir/resources.pri"))) {
            Get-ChildItem $dir -Filter *.pri | Format-Table Name, Length
            throw "SpaceKeeper.pri is missing from the published app, so its windows can't load."
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath SpaceKeeper-${{ matrix.rid }}.zip

      - name: Upload download
        uses: actions/upload-artifact@v4
        with:
          name: SpaceKeeper-${{ matrix.rid }}
          path: SpaceKeeper-${{ matrix.rid }}.zip

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpaceKeeper-${{ matrix.rid }}.zip
