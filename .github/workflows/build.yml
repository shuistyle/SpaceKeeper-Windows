# ======================================================================
# build.yml — GitHub builds SpaceKeeper for Windows automatically
# ======================================================================
# Every time code is pushed to GitHub, a Windows machine in the cloud:
#   1. runs the automatic tests for SpaceKeeper.Core,
#   2. builds SpaceKeeper for Intel/AMD (x64) and Arm (ARM64) PCs,
#   3. uploads each as a .zip you can download from the run's
#      "Artifacts" section (Actions tab on GitHub).
# Pushing a version tag such as v1.0.0 also creates a GitHub Release with
# both zips attached — that's the easiest download link to share.
#
# Security:
#   • Read-only by default. Only the final "release" job may write to the
#     repository, and only for version tags.
#   • Every GitHub Action is pinned to an exact commit (the long number
#     after @), so nobody can change the code a build runs by moving a tag.
#     The comment after each shows the version. Dependabot proposes updates.
# ======================================================================
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read       # least privilege: jobs can read the code, nothing more

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4.4.0
        with:
          persist-credentials: false   # don't leave a GitHub token on the build machine
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        run: dotnet test tests/SpaceKeeper.Core.Tests/SpaceKeeper.Core.Tests.csproj -c Release

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # lets GitHub vouch for this build (attestation below)
      attestations: write   # stores that proof with the repository
      actions: read         # lets SignPath fetch the unsigned files from this run
    env:
      # Code signing runs only for version tags, and only once SignPath is set
      # up (the SIGNPATH_API_TOKEN secret exists). Until then builds are unsigned.
      SIGN_THIS_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4.4.0
        with:
          persist-credentials: false   # don't leave a GitHub token on the build machine
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # The version comes from the tag (v1.2.3 → 1.2.3) and is written into
      # SpaceKeeper.exe, so Windows and SignPath can see which release it is.
      - name: Work out the version
        shell: pwsh
        run: |
          $v = "0.0.0"
          if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1] }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          "Version: $v"

      - name: Build and publish (${{ matrix.platform }})
        run: >
          dotnet publish src/SpaceKeeper.App/SpaceKeeper.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:Version=${{ env.APP_VERSION }}
          --self-contained true
          -o publish/${{ matrix.rid }}

      # Stop here (rather than publish a download that can't open its windows)
      # if the compiled layouts file is missing.
      - name: Check the layouts file is included
        shell: pwsh
        run: |
          $dir = "publish/${{ matrix.rid }}"
          if (-not ((Test-Path "$dir/SpaceKeeper.pri") -or (Test-Path "$dir/resources.pri"))) {
            Get-ChildItem $dir -Filter *.pri | Format-Table Name, Length
            throw "SpaceKeeper.pri is missing from the published app, so its windows can't load."
          }

      # ---- Optional code signing via SignPath (not set up: these steps only run
      # if a SIGNPATH_API_TOKEN secret is added to the repository) ----
      # 1. Hand the unsigned files to GitHub, 2. ask SignPath to sign
      # SpaceKeeper's own files (a person approves each release in SignPath),
      # 3. put the signed files back in place and check the signature.
      - name: Upload unsigned files for signing
        id: upload-unsigned
        if: env.SIGN_THIS_BUILD == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: unsigned-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/

      - name: Sign with SignPath
        if: env.SIGN_THIS_BUILD == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092   # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.APP_VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400   # time for you to approve (24 hours)
          output-artifact-directory: signed/${{ matrix.rid }}

      - name: Use the signed files
        if: env.SIGN_THIS_BUILD == 'true'
        shell: pwsh
        run: |
          Copy-Item -Path "signed/${{ matrix.rid }}/*" -Destination "publish/${{ matrix.rid }}" -Recurse -Force
          foreach ($name in "SpaceKeeper.exe", "SpaceKeeper.dll", "SpaceKeeper.Core.dll") {
            $sig = Get-AuthenticodeSignature "publish/${{ matrix.rid }}/$name"
            "$name : $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$name isn't validly signed." }
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath SpaceKeeper-${{ matrix.rid }}.zip

      # Proof of origin: GitHub records that this exact zip was built by this
      # workflow from this repository. Anyone can check a download with
      #   gh attestation verify SpaceKeeper-win-x64.zip --repo shuistyle/SpaceKeeper-Windows
      # (Skipped for pull requests, which can't create attestations.)
      - name: Record build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be   # v2.4.0
        with:
          subject-path: SpaceKeeper-${{ matrix.rid }}.zip

      - name: Upload download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: SpaceKeeper-${{ matrix.rid }}
          path: SpaceKeeper-${{ matrix.rid }}.zip

  # Creates the GitHub Release for version tags. The ONLY job allowed to write.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the Release and attach the zips
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          path: downloads
          pattern: SpaceKeeper-*      # the finished zips (not the unsigned files sent for signing)
          merge-multiple: true
      # A checksum list, so a download can be checked for damage or tampering.
      - name: Make SHA256SUMS.txt
        working-directory: downloads
        run: sha256sum SpaceKeeper-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2
        with:
          files: |
            downloads/SpaceKeeper-*.zip
            downloads/SHA256SUMS.txt
          body: |
            **Install or update** — paste into PowerShell (no warning, no administrator rights needed):
            ```
            powershell -c "irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex"
            ```
            It picks the right download for your PC, checks it against `SHA256SUMS.txt`, installs it to your private apps folder and starts it.

            **Or download by hand:** `SpaceKeeper-win-x64.zip` for most PCs, `SpaceKeeper-win-arm64.zip` for Arm PCs (e.g. Snapdragon, or Windows on an Apple-silicon Mac). Check it with `Get-FileHash .\SpaceKeeper-win-x64.zip` against `SHA256SUMS.txt` (or `gh attestation verify SpaceKeeper-win-x64.zip --repo ${{ github.repository }}`), then extract, run `SpaceKeeper.exe` and click **Install** in its panel.
